<div class="permission-group mb-6">
  <h3 class="text-[19px] font-semibold text-black mb-2">
    {{ 'PERMISSIONS.GROUPS.' + group.id.toUpperCase() + '_MANAGEMENT' | translate }}
  </h3>
  <div class="flex flex-wrap gap-2 items-center">
    @for (toggle of group.toggles; track toggle) {
      <label class="flex items-center gap-2 cursor-pointer">
        <button
          type="button"
          class="w-[35.33px] h-[20px] rounded-[10px] relative transition-all duration-200"
          [style.background]="
            isActive(toggle)
              ? 'linear-gradient(90deg, rgb(2,71,208), rgb(141,169,251))'
              : 'linear-gradient(90deg, rgb(82,82,82), rgb(184,184,184))'
          "
          (click)="togglePermission(toggle)"
        >
          <span
            class="absolute w-[12px] h-[12px] rounded-full bg-white top-[4px] left-[4px] transition-transform duration-200"
            [style.transform]="isActive(toggle) ? 'translateX(23.33px)' : 'translateX(0)'"
          ></span>
        </button>
        <span class="text-sm text-gray-700">{{
          'PERMISSIONS.TOGGLES.' + toggle.toUpperCase() | translate
        }}</span>
      </label>
    }
  </div>
  @if (group.access) {
    <div class="access-section mt-3">
      <app-access-type-tabs
        [group]="group"
        [permissions]="permissions"
        (permissionsChange)="permissionsChange.emit($event)"
      />
    </div>
  }
</div>
