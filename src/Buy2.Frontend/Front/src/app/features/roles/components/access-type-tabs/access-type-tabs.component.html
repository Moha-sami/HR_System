<div class="access-type-tabs flex flex-wrap gap-2 items-center mt-3 pt-3 border-t border-[#E9EAF3]">
  <span class="text-sm text-gray-600 mr-2">{{ 'PERMISSIONS.ACCESS_TYPES.LABEL' | translate }}</span>
  @for (type of group.access?.types; track type) {
    <button
      type="button"
      class="px-4 py-2 rounded-[6px] text-sm font-medium transition-colors border"
      [class.bg-blue-600]="isTypeActive(type)"
      [class.text-white]="isTypeActive(type)"
      [class.border-blue-600]="isTypeActive(type)"
      [class.bg-transparent]="!isTypeActive(type)"
      [class.text-gray-700]="!isTypeActive(type)"
      [class.border-gray-300]="!isTypeActive(type)"
      (click)="setAccessType(type)"
    >
      {{ 'PERMISSIONS.ACCESS_TYPES.' + type.toUpperCase() | translate }}
    </button>
  }
  <button
    type="button"
    class="px-4 py-2 rounded-[6px] text-sm font-medium text-gray-600 bg-transparent border border-gray-300 hover:border-gray-400 hover:text-gray-900"
    (click)="openGroupsModal()"
  >
    {{ 'PERMISSIONS.ACCESS_TYPES.CHOOSE_GROUPS' | translate }}
  </button>
</div>
