<div class="role-create p-6">
  <h1 class="text-2xl font-semibold mb-6">Create Role</h1>

  <form (ngSubmit)="onSubmit()" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label for="roleName" class="block text-sm font-medium text-gray-700 mb-1">Role Name</label>
        <input
          id="roleName"
          [(ngModel)]="roleName"
          name="roleName"
          type="text"
          class="w-full px-4 py-[13px] border border-gray-300 rounded-[6px] bg-[rgba(217,217,217,0.23)] focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          required
        />
      </div>
      <div>
        <label for="description" class="block text-sm font-medium text-gray-700 mb-1"
          >Description</label
        >
        <textarea
          id="description"
          [(ngModel)]="description"
          name="description"
          rows="3"
          class="w-full px-4 py-[13px] border border-gray-300 rounded-[6px] bg-[rgba(217,217,217,0.23)] focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        ></textarea>
      </div>
    </div>

    <div class="permissions-section">
      <div class="flex items-center justify-between px-4 py-[16px] border-b border-[#E9EAF3] mb-4">
        <h2 class="text-[19px] font-semibold text-black">Permissions</h2>
      </div>
      @for (group of PERMISSION_GROUPS; track group.id) {
        <div class="mb-6 px-4">
          <app-permission-group
            [group]="group"
            [permissions]="permissions"
            (permissionsChange)="permissions = $event"
          />
        </div>
      }
    </div>

    <div class="flex justify-end gap-3 pt-4 border-t border-[#E9EAF3]">
      <button
        type="button"
        class="px-4 py-2 border border-gray-300 rounded-[6px] text-sm font-medium text-gray-700 hover:bg-gray-50"
        (click)="onDiscard()"
      >
        Discard
      </button>
      <button
        type="submit"
        class="px-4 py-2 bg-blue-600 text-white rounded-[6px] text-sm font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
        [disabled]="!roleName"
      >
        Save
      </button>
    </div>
  </form>
</div>

@if (showSuccessModal()) {
  <app-modal
    size="small"
    (closed)="onSuccessClose()"
    [closeOnBackdrop]="false"
    [closeOnEscape]="false"
  >
    <app-modal-header>
      <h3 class="text-lg font-semibold text-[#1E1E1E]">Role Created</h3>
    </app-modal-header>
    <app-modal-body>
      <div class="text-center">
        <div
          class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4"
        >
          <svg class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>
        <p class="text-[#868686]">The role has been created successfully.</p>
      </div>
    </app-modal-body>
    <app-modal-footer>
      <app-button variant="primary" (clicked)="onSuccessClose()">OK</app-button>
    </app-modal-footer>
  </app-modal>
}
