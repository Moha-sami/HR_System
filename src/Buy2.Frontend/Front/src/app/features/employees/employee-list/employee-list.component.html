<div class="employee-list p-6">

  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-neutral-900">
      Employee Management
    </h1>

    <app-button variant="primary" (clicked)="navigateToAddEmployee()">Add Employees</app-button>
  </div>

  <app-table
    [columns]="columns"
    [rows]="displayedEmployees()"
    [cellTemplates]="cellTemplates()"
    emptyMessage="No employees available"
  />

  <div class="mt-4 flex justify-center">
    <app-pagination
      [totalPages]="totalPages"
      [initialPage]="1"
      (pageChanged)="onPageChanged($event)"
    />
  </div>

  <ng-template #employeeNameTemplate let-employee>
    <span>{{ employee.firstName }} {{ employee.lastName }}</span>
  </ng-template>

  <ng-template #actionsTemplate let-employee>
    <button
      type="button"
      class="rounded p-1 text-primary-600 transition-colors hover:bg-primary-50 focus:outline-none focus:ring-2 focus:ring-primary-400"
      [attr.aria-label]="'View ' + employee.firstName + ' ' + employee.lastName"
      (click)="viewEmployee(employee); $event.stopPropagation()"
    >
      <svg aria-hidden="true" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
        <circle cx="12" cy="12" r="2.5" />
      </svg>
    </button>
  </ng-template>

</div>
