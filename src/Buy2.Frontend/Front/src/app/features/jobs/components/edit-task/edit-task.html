<div class="p-6 h-full flex flex-col relative w-full bg-white max-w-5xl mx-auto rounded-xl border border-gray-100 shadow-sm mt-4">
  <div class="flex justify-between items-center mb-8 border-b border-gray-100 pb-4">
    <div class="flex items-center text-sm">
      <span class="text-gray-400">Job Management</span>
      <span class="mx-2 text-gray-400">/</span>
      <span class="font-medium text-gray-900">Edit Task</span>
    </div>
  </div>

  <div class="grid grid-cols-[250px_1fr] gap-y-8 text-sm">
    <div class="text-primary-800 font-medium pt-3">Task Name</div>
    <div>
      <input type="text" class="w-full bg-gray-50 border-none rounded-md px-4 py-3 outline-none" [value]="taskName" readonly />
    </div>

    <div class="text-primary-800 font-medium pt-3">Steps to complete task</div>
    <div class="flex flex-col gap-4">
      <div class="flex gap-2">
        <input type="text" placeholder="Type step here ..." class="flex-1 bg-gray-50 border-none rounded-md px-4 py-3 outline-none" />
        <button class="bg-primary-800 text-white px-4 py-2 rounded-md font-medium">+ Add Step</button>
      </div>

      <div *ngFor="let step of steps; let i = index" class="flex items-center justify-between group py-2" [ngClass]="{'bg-gray-50 px-4 rounded-md': step.editing}">
        <span *ngIf="!step.editing" class="font-medium">{{ i + 1 }}. {{ step.text }}</span>
        <input *ngIf="step.editing" type="text" [value]="step.text" class="flex-1 bg-transparent border-none outline-none font-medium" />
        <div class="flex gap-3 text-gray-400">
          <button *ngIf="step.editing" class="text-green-600"><svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></button>
          <button *ngIf="step.editing" class="hover:text-gray-600"><svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
          
          <button *ngIf="!step.editing" class="text-primary-600 hover:text-primary-800"><svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 3.487a2.25 2.25 0 0 1 3.182 3.182L8.25 18.463 4.5 19.5l1.037-3.75L16.862 3.487Z" /></svg></button>
          <button class="text-red-500 hover:text-red-700"><svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7m-7 0 .75 12.25A1.5 1.5 0 0 0 10.247 20h3.506a1.5 1.5 0 0 0 1.497-1.75L16 7M10 10.5v6M14 10.5v6" /></svg></button>
        </div>
      </div>
    </div>

    <div class="text-primary-800 font-medium pt-3">Description</div>
    <div>
      <textarea rows="4" class="w-full bg-gray-50 border-none rounded-md px-4 py-3 outline-none" readonly>{{ description }}</textarea>
    </div>

    <div class="text-primary-800 font-medium pt-3">Attach files</div>
    <div class="flex flex-col gap-4">
      <div class="flex gap-2">
        <div class="flex-1 bg-gray-50 border-none rounded-md px-4 py-3"></div>
        <button class="bg-primary-800 text-white px-6 py-2 rounded-md font-medium">Browse</button>
      </div>
      
      <div *ngIf="file" class="inline-flex items-center gap-3 bg-gray-50 rounded-md px-4 py-2 w-max">
        <span class="text-red-600 font-bold bg-white rounded p-1 text-[10px]">PDF</span>
        <span class="text-gray-600">{{ file }}</span>
        <div class="flex gap-2 ml-4">
          <button class="text-primary-600 hover:text-primary-800"><svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" /><circle cx="12" cy="12" r="2.5" /></svg></button>
          <button class="text-primary-600 hover:text-primary-800"><svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 3.487a2.25 2.25 0 0 1 3.182 3.182L8.25 18.463 4.5 19.5l1.037-3.75L16.862 3.487Z" /></svg></button>
          <button class="text-red-500 hover:text-red-700"><svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7m-7 0 .75 12.25A1.5 1.5 0 0 0 10.247 20h3.506a1.5 1.5 0 0 0 1.497-1.75L16 7M10 10.5v6M14 10.5v6" /></svg></button>
        </div>
      </div>
    </div>

    <div class="text-primary-800 font-medium">Repeat</div>
    <div class="flex gap-6 items-center">
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="repeat" class="size-4 accent-primary-800" [checked]="repeat === 'Daily'" /> Daily
      </label>
      <label class="flex items-center gap-2 cursor-pointer text-gray-500">
        <input type="radio" name="repeat" class="size-4 accent-primary-800" /> Weekly
      </label>
      <label class="flex items-center gap-2 cursor-pointer text-gray-500">
        <input type="radio" name="repeat" class="size-4 accent-primary-800" /> Multiple days
      </label>
      <label class="flex items-center gap-2 cursor-pointer text-gray-500">
        <input type="radio" name="repeat" class="size-4 accent-primary-800" /> Monthly
      </label>
    </div>

    <div class="text-primary-800 font-medium pt-3">Submission time</div>
    <div>
      <div class="relative w-full">
        <input type="text" class="w-full bg-gray-50 border-none rounded-md px-4 py-3 outline-none" [value]="submissionTime" readonly />
        <svg class="absolute right-4 top-1/2 -translate-y-1/2 size-5 text-primary-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
      </div>
    </div>
  </div>

  <div class="mt-8 pt-6 border-t border-gray-100 flex justify-end gap-4">
    <button class="text-primary-800 px-6 py-2 font-medium hover:bg-gray-50 rounded-md transition-colors">Discard</button>
    <button class="bg-primary-800 text-white px-6 py-2 rounded-md font-medium hover:bg-primary-900 transition-colors">Update Task</button>
  </div>
</div>
