<div class="job-management p-6 relative h-full">

  <!-- ===================================================== -->
  <!-- TOP HEADER -->
  <!-- ===================================================== -->

  <div class="mb-6 flex items-center justify-between">

    <h1 class="text-2xl font-semibold text-neutral-900">
      Job Management
    </h1>


    <!-- SORT + EXPORT -->
    <div class="flex items-center gap-3">

      <!-- SORT -->
      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-md bg-primary-700 px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-primary-800"
        (click)="onSortToggle()"
      >

        <span>
          Sort
        </span>


        <svg
          aria-hidden="true"
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8 6h13M8 12h9M8 18h5"
          />

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 6v12m0 0-2-2m2 2 2-2"
          />

        </svg>

      </button>


      <!-- EXPORT -->
      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-md bg-red-600 px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-red-700"
        (click)="onExport()"
      >

        <span>
          Export
        </span>


        <svg
          aria-hidden="true"
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 3v12"
          />

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m8 11 4 4 4-4"
          />

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M5 20h14"
          />

        </svg>

      </button>

    </div>

  </div>


  <!-- ===================================================== -->
  <!-- SEARCH + CREATE -->
  <!-- ===================================================== -->

  <div class="mb-5 flex items-center gap-4">

    <!-- SEARCH -->
    <div class="relative flex-1">

      <svg
        aria-hidden="true"
        class="absolute left-4 top-1/2 size-5 -translate-y-1/2 text-neutral-500"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >

        <circle
          cx="11"
          cy="11"
          r="7"
        />

        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m20 20-4-4"
        />

      </svg>


      <input
        type="text"
        class="w-full rounded-lg border border-primary-200 bg-white py-3 pl-11 pr-4 outline-none transition-colors focus:border-primary-500"
        placeholder="Type here..."
        [value]="searchTerm()"
        (input)="onSearch($event)"
      />

    </div>


    <!-- CREATE NEW JOB -->
    <app-button
      variant="primary"
      (clicked)="navigateToCreateJob()"
    >
      Create a New Job
    </app-button>

  </div>


  <!-- ===================================================== -->
  <!-- TABLE -->
  <!-- ===================================================== -->

  <app-table
    [columns]="columns()"
    [rows]="displayedJobs()"
    [cellTemplates]="cellTemplates()"
    emptyMessage="No jobs available"
    (sortChange)="onSort($event)"
  />


  <!-- ===================================================== -->
  <!-- PAGINATION -->
  <!-- ===================================================== -->

  <div class="mt-4 flex justify-center">

    <app-pagination
      [totalPages]="totalPages()"
      [initialPage]="1"
      (pageChanged)="onPageChanged($event)"
    />

  </div>


  <!-- ===================================================== -->
  <!-- ACTIONS TEMPLATE -->
  <!-- ===================================================== -->

  <ng-template
    #actionsTemplate
    let-job
  >

    <div class="flex items-center justify-center gap-2">


      <!-- ================================================= -->
      <!-- EDIT -->
      <!-- ================================================= -->

      <button
        type="button"
        class="rounded p-1 text-primary-600 transition-colors hover:bg-primary-50 focus:outline-none focus:ring-2 focus:ring-primary-400"
        aria-label="Edit Job"
        title="Edit Job"
        (click)="editJob(job); $event.stopPropagation()"
      >

        <svg
          aria-hidden="true"
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16.862 3.487a2.25 2.25 0 0 1 3.182 3.182L8.25 18.463 4.5 19.5l1.037-3.75L16.862 3.487Z"
          />

        </svg>

      </button>


      <!-- ================================================= -->
      <!-- DELETE -->
      <!-- ================================================= -->

      <button
        type="button"
        class="rounded p-1 text-red-600 transition-colors hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-400"
        aria-label="Delete Job"
        title="Delete Job"
        (click)="deleteJob(job); $event.stopPropagation()"
      >

        <svg
          aria-hidden="true"
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 7h12M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7m-7 0 .75 12.25A1.5 1.5 0 0 0 10.247 20h3.506a1.5 1.5 0 0 0 1.497-1.75L16 7M10 10.5v6M14 10.5v6"
          />

        </svg>

      </button>


      <!-- ================================================= -->
      <!-- VIEW -->
      <!-- ================================================= -->

      <button
        type="button"
        class="rounded p-1 text-primary-600 transition-colors hover:bg-primary-50 focus:outline-none focus:ring-2 focus:ring-primary-400"
        [attr.aria-label]="'View ' + job.jobName"
        title="View Job"
        (click)="viewJob(job); $event.stopPropagation()"
      >

        <svg
          aria-hidden="true"
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
          />

          <circle
            cx="12"
            cy="12"
            r="2.5"
          />

        </svg>

      </button>


    </div>

  </ng-template>

  <router-outlet></router-outlet>
</div>
