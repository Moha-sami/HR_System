<nav class="flex items-center gap-2" aria-label="Pagination">
  <app-button
    variant="ghost"
    size="sm"
    shape="circle"
    [disabled]="currentPage() === 1"
    (clicked)="previousPage()"
    aria-label="Previous page"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6" />
    </svg>
  </app-button>

  @for (page of pages(); track $index) {
    @if (page === 'ellipsis') {
      <span class="px-1 text-sm text-neutral-500" aria-hidden="true">&hellip;</span>
    } @else {
      <app-button
        variant="ghost"
        size="sm"
        [attr.aria-current]="currentPage() === page ? 'page' : null"
        [attr.aria-label]="'Page ' + page"
        (clicked)="changePage(page)"
      >
        {{ page }}
      </app-button>
    }
  }

  <app-button
    variant="ghost"
    size="sm"
    shape="circle"
    [disabled]="currentPage() === validTotalPages()"
    (clicked)="nextPage()"
    aria-label="Next page"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
    </svg>
  </app-button>
</nav>
