<div class="dropdown" [class.dropdown-open]="isOpen()" [id]="id">
  <label *ngIf="label" class="dropdown-label block text-sm font-medium text-gray-700 mb-1">
    {{ label }}
  </label>

  <div
    class="dropdown-trigger"
    tabindex="0"
    (click)="toggleOpen()"
    (blur)="onBlur()"
    (keydown.enter)="toggleOpen()"
    (keydown.space)="$event.preventDefault(); toggleOpen()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-haspopup]="true"
    [attr.aria-disabled]="disabled"
  >
    <span
      class="dropdown-display flex items-center justify-between w-full px-4 py-2.5 border border-gray-300 rounded-[6px] bg-white text-left text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 hover:border-gray-400 transition-colors"
      [class.opacity-50]="disabled"
    >
      <span
        [class.text-gray-400]="!selectedOptions.length"
        [class.text-gray-900]="selectedOptions.length"
      >
        {{ displayText }}
      </span>
      <svg
        class="w-4 h-4 text-gray-500 ml-2 flex-shrink-0"
        [class.rotate-180]="isOpen()"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </span>

    @if (isOpen()) {
      <div
        class="dropdown-panel absolute z-20 w-full mt-1 bg-white border border-gray-300 rounded-[6px] shadow-lg max-h-60 overflow-y-auto"
      >
        @for (option of options; track option.id) {
          <button
            type="button"
            class="dropdown-option w-full px-4 py-2.5 text-left text-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 flex items-center gap-2 transition-colors"
            [class.opacity-50]="option.disabled"
            [class.bg-blue-50]="isSelected(option)"
            (click)="selectOption(option)"
            [disabled]="option.disabled"
          >
            @if (mode === 'single') {
              <svg
                class="w-4 h-4 text-blue-600 flex-shrink-0"
                fill="currentColor"
                viewBox="0 0 20 20"
                *ngIf="isSelected(option)"
              >
                <path
                  fill-rule="evenodd"
                  d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                  clip-rule="evenodd"
                />
              </svg>
            } @else {
              <svg
                class="w-4 h-4 text-blue-600 flex-shrink-0"
                fill="currentColor"
                viewBox="0 0 20 20"
                *ngIf="isSelected(option)"
              >
                <path
                  fill-rule="evenodd"
                  d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                  clip-rule="evenodd"
                />
              </svg>
              <svg
                class="w-4 h-4 text-gray-300 flex-shrink-0"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                *ngIf="!isSelected(option)"
              >
                <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2" />
              </svg>
            }
            <span
              class="text-gray-700"
              [class.text-blue-600]="isSelected(option)"
              [class.opacity-50]="option.disabled"
            >
              {{ option.name }}
            </span>
          </button>
        }
        @if (options.length === 0) {
          <div class="px-4 py-3 text-center text-gray-500 text-sm">
            {{ 'COMMON.NO_OPTIONS' | translate }}
          </div>
        }
      </div>
    }
  </div>

  @if (error) {
    <p class="mt-1 text-sm text-red-600" role="alert">{{ error }}</p>
  }
</div>
