<nav
  class="breadcrumb-nav bg-white border-b border-[#E2E2E2] px-6 py-4"
  aria-label="Breadcrumb"
  *ngIf="items().length > 0"
>
  <ol class="flex items-center space-x-2 text-sm" role="list">
    <li *ngFor="let item of items(); let last = last" class="flex items-center">
      <ng-container *ngIf="!last; else activeItem">
        <a
          [routerLink]="item.url"
          class="text-[#868686] hover:text-[#234199] transition-colors flex items-center gap-1.5"
        >
          <span>{{ item.label }}</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 text-[#B8B8B8]"
            viewBox="0 0 20 20"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
              clip-rule="evenodd"
            />
          </svg>
        </a>
      </ng-container>
      <ng-template #activeItem>
        <span class="text-[#1E1E1E] font-medium flex items-center gap-1.5" aria-current="page">
          <span>{{ item.label }}</span>
        </span>
      </ng-template>
    </li>
  </ol>
</nav>
