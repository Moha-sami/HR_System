# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: "2"
language: "en-US"
tone_instructions: "Be concise, actionable, and focus on security, clean architecture, EF Core correctness, and Jira task alignment."
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - ".*"
  path_instructions:
    - path: "src/Buy2.Api/**"
      instructions: "Ensure API controllers have proper [Authorize] attributes with specific roles where required. Enforce proper HTTP status codes and route conventions."
    - path: "src/Buy2.Domain/**"
      instructions: "Domain entities must remain pure with zero external framework dependencies."
    - path: "src/Buy2.Application/**"
      instructions: "Check MediatR commands, queries, and handlers. Verify input validation and business logic correctness."
    - path: "src/Buy2.Infrastructure/**"
      instructions: "Verify EF Core configurations, navigation properties, migrations, and parameterized query execution."
  tools:
    ast-grep:
      enabled: true

chat:
  auto_reply: true
