# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: "2"
language: "en-US"
tone_instructions: "Be concise. Enforce Jira ticket requirements and flag security vulnerabilities. Provide plain-text guidance only, never write code blocks or solutions."
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false
  collapse_walkthrough: true
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
  path_instructions:
    - path: "**"
      instructions: "Check PR against Jira ticket requirements. Flag security and logical flaws with conceptual guidance only. Do not provide code."

chat:
  auto_reply: true
