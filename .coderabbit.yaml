# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: "2"
language: "en-US"
tone_instructions: |
  You are a strict Jira-compliance and security reviewer.
  Your review must include:
  1. High-Level Summary: Clear, structured bullet points of new features and documentation changes.
  2. Jira Requirement Gaps: Compare the PR code directly against the linked Jira ticket (e.g. SCRUM-XXX) and flag any missing requirements or incomplete acceptance criteria.
  3. Critical Bugs & Security: Flag security vulnerabilities (auth/role bypass, PII leaks, SQL injection, hardcoded secrets) and breaking runtime bugs.
  Do NOT comment on minor code style, formatting, docstrings, or cosmetic improvements.
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false
  collapse_walkthrough: true
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
  path_instructions:
    - path: "**"
      instructions: "Check PR changes against Jira ticket requirements. Provide clean high-level feature summary and flag critical security/logical issues only."

chat:
  auto_reply: true
