# Render Blueprint for the HR System mock JSON API.
# Deploy: push this repo to GitHub, then in Render Dashboard ->
# New -> Blueprint -> select this repo. Render reads this file
# and creates the service automatically.
services:
  - type: web
    name: hr-system-mock-api
    runtime: node
    rootDir: src/Buy2.Frontend/Front/JsonServer
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /departments
