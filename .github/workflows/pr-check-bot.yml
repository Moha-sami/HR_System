name: PR Validation & Feedback Bot

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [ "main" ]

jobs:
  validate-pr:
    name: Validate PR Naming, Build, Review & Security (scoped)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Check Jira Key in PR Title / Branch
      id: check-key
      run: |
        python -c "
        import os, re

        title = '''${{ github.event.pull_request.title }}'''
        branch = '''${{ github.event.pull_request.head.ref }}'''

        m_task = re.search(r'Task\s*[-_]?\s*\d+', title, re.IGNORECASE) or re.search(r'Task\s*[-_]?\s*\d+', branch, re.IGNORECASE)
        m_scrum = re.search(r'SCRUM[-_]?\d+', title, re.IGNORECASE) or re.search(r'SCRUM[-_]?\d+', branch, re.IGNORECASE)

        has_key = bool(m_task or m_scrum)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'missing_key={\"false\" if has_key else \"true\"}\n')
        "

    - name: Detect PR changeset (C# vs dependency files)
      id: changes
      run: |
        BASE="${{ github.event.pull_request.base.sha }}"
        HEAD="${{ github.event.pull_request.head.sha }}"
        if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
          BASE="$(git merge-base origin/main HEAD 2>/dev/null || echo 'origin/main')"
        fi
        if [ -z "$HEAD" ] || ! git cat-file -e "$HEAD" 2>/dev/null; then
          HEAD="HEAD"
        fi
        echo "Base: $BASE Head: $HEAD"

        CHANGED="$(git diff --name-only --diff-filter=ACMR "$BASE...$HEAD" 2>/dev/null || true)"
        echo "$CHANGED" > /tmp/pr_changed_files.txt

        CS_COUNT="$(echo "$CHANGED" | grep -E '\.(cs|vb)$' | grep -c . || true)"
        DEP_COUNT="$(echo "$CHANGED" | grep -E '(\.csproj|\.props|\.targets|\.slnx|\.sln|packages\.lock\.json|package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|Dockerfile|\.dockerfile|docker-compose.*\.yml|dotnet-tools\.json|[Nn]u[Gg]et\.config|global\.json)$' | grep -c . || true)"

        {
          echo "base_sha=$BASE"
          echo "head_sha=$HEAD"
          echo "cs_count=$CS_COUNT"
          echo "dep_count=$DEP_COUNT"
          if [ "$CS_COUNT" -gt 0 ]; then echo "has_cs_changes=true"; else echo "has_cs_changes=false"; fi
          if [ "$DEP_COUNT" -gt 0 ]; then echo "has_dep_changes=true"; else echo "has_dep_changes=false"; fi
        } >> "$GITHUB_OUTPUT"

        echo "Changed C# files: $CS_COUNT, dependency files: $DEP_COUNT"

    - name: Check formatting on changed C# files only
      id: format-check
      if: steps.changes.outputs.has_cs_changes == 'true'
      continue-on-error: true
      run: |
        BASE="${{ steps.changes.outputs.base_sha }}"
        HEAD="${{ steps.changes.outputs.head_sha }}"
        FILES="$(git diff --name-only --diff-filter=ACMR "$BASE...$HEAD" -- '*.cs' '*.vb' 2>/dev/null || true)"
        echo "Changed C# files:"
        echo "$FILES"

        INCLUDE_ARGS=""
        COUNT=0
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          if [ -f "$f" ]; then
            INCLUDE_ARGS="$INCLUDE_ARGS --include $f"
            COUNT=$((COUNT + 1))
          fi
        done <<< "$FILES"

        if [ "$COUNT" -eq 0 ]; then
          echo "No existing changed C# files to check (all deleted/renamed). Passing."
          exit 0
        fi

        # shellcheck disable=SC2086
        dotnet format HR_system.slnx --verify-no-changes $INCLUDE_ARGS

    - name: Build & Analyze .NET Solution
      id: build-check
      continue-on-error: true
      run: |
        dotnet build HR_system.slnx \
          --configuration Release \
          -p:EnableNETAnalyzers=true

    - name: Security Vulnerability Scan (Trivy, dependency changes only)
      id: security-scan
      if: steps.changes.outputs.has_dep_changes == 'true'
      continue-on-error: true
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: "fs"
        scan-ref: "."
        format: "table"
        exit-code: "1"
        ignore-unfixed: true
        severity: "CRITICAL,HIGH"

    - name: Post Automated Feedback Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const missingKey = '${{ steps.check-key.outputs.missing_key }}' === 'true';
          const formatFailed = '${{ steps.format-check.outcome }}' === 'failure';
          const formatSkipped = '${{ steps.format-check.outcome }}' === 'skipped';
          const buildFailed = '${{ steps.build-check.outcome }}' === 'failure';
          const securityFailed = '${{ steps.security-scan.outcome }}' === 'failure';
          const securitySkipped = '${{ steps.security-scan.outcome }}' === 'skipped';
          const csCount = '${{ steps.changes.outputs.cs_count }}';
          const depCount = '${{ steps.changes.outputs.dep_count }}';

          let commentBody = '## Automated PR Validation Feedback\n\n';

          if (!missingKey && !formatFailed && !buildFailed && !securityFailed) {
            commentBody += '**All Checks Passed!**\n\n';
            commentBody += '- Jira key / Task reference detected.\n';
            commentBody += formatSkipped
              ? '- Code formatting skipped (no changed C# files in this PR).\n'
              : `- Code formatting passed (${csCount} changed C# file(s)).\n`;
            commentBody += '- .NET 10 solution compiled successfully.\n';
            commentBody += '- .NET analyzers passed.\n';
            commentBody += securitySkipped
              ? '- Security scan skipped (no dependency changes in this PR).\n\n'
              : '- Security scan passed (no Critical/High vulnerabilities).\n\n';
            commentBody += 'Ready for maintainer review!';
          } else {
            commentBody += '**Action Needed on this Pull Request:**\n\n';
            if (missingKey) {
              commentBody += '- **Missing Jira Key**: Please include your Jira key (e.g. `SCRUM-6`) in your PR title or branch name.\n';
            }
            if (formatFailed) {
              commentBody += `- **Code Formatting Failed**: ${csCount} changed C# file(s) do not match formatting rules. Run \`dotnet format\` locally on your changed files and commit the result.\n`;
            }
            if (buildFailed) {
              commentBody += '- **Build Failure**: The .NET 10 solution failed to compile or analyzers found errors. Run `dotnet build` locally and fix the issues.\n';
            }
            if (securityFailed) {
              commentBody += `- **Security Issues**: Trivy found High/Critical vulnerabilities in ${depCount} changed dependency file(s). Please check the workflow logs for details.\n`;
            }
            commentBody += '\nPlease push a fix to your branch to re-run validation!';
          }

          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: commentBody
          });
