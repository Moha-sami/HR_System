name: Auto-Remove Completed Task from AVAILABLE_TASKS.md

on:
  pull_request:
    types: [closed]
    branches: [ "main" ]

jobs:
  update-tasks-file:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Parse PR Title and Update AVAILABLE_TASKS.md
      run: |
        python -c "
        import re, os

        pr_title = '''${{ github.event.pull_request.title }}'''
        pr_branch = '''${{ github.event.pull_request.head.ref }}'''

        match = re.search(r'Task\s*(\d+)', pr_title, re.IGNORECASE) or re.search(r'Task\s*(\d+)', pr_branch, re.IGNORECASE)
        
        if not match:
            print('No Task number found. Skipping.')
            exit(0)

        task_num = match.group(1)
        print(f'Found Task Number: Task {task_num}')

        file_path = 'AVAILABLE_TASKS.md'
        with open(file_path, 'r', encoding='utf-8') as f:
            content = f.read()

        pattern = rf'### Task {task_num}:.*?(?=(### Task|\n## |\Z))'
        
        if re.search(pattern, content, re.DOTALL):
            new_content = re.sub(pattern, '', content, flags=re.DOTALL)
            with open(file_path, 'w', encoding='utf-8') as f:
                f.write(new_content)
            print(f'Successfully removed Task {task_num}')
        "

    - name: Commit and Push Updated AVAILABLE_TASKS.md
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add AVAILABLE_TASKS.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-remove completed Task from AVAILABLE_TASKS.md [PR #${{ github.event.pull_request.number }}]" && git push)
