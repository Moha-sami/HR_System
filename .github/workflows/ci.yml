name: HR_system CI/CD & MonsterASP Auto-Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-dotnet:
    name: Build & Test .NET Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Restore & Build Solution
      run: dotnet build --configuration Release HR_system.slnx

    - name: Publish .NET Backend API
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: dotnet publish src/Buy2.Api/Buy2.Api.csproj -c Release -o publish_out

    - name: Inject Production Database Password
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      env:
        DB_PASS: ${{ secrets.MONSTERASP_DB_PASSWORD }}
      run: |
        if [ -z "$DB_PASS" ]; then
          echo "::error::MONSTERASP_DB_PASSWORD secret is not set"
          exit 1
        fi
        sed -i "s|YOUR_MONSTERASP_DB_PASSWORD|${DB_PASS}|g" publish_out/appsettings.json

    - name: Apply EF Core Migrations
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      env:
        ConnectionStrings__DefaultConnection: ${{ secrets.MONSTERASP_DB_CONNECTION_STRING }}
      run: |
        if [ -z "$ConnectionStrings__DefaultConnection" ]; then
          echo "::error::MONSTERASP_DB_CONNECTION_STRING secret is not set"
          exit 1
        fi
        dotnet tool install --global dotnet-ef || dotnet tool update --global dotnet-ef
        dotnet ef database update --project src/Buy2.Infrastructure --startup-project src/Buy2.Api

    - name: Take Site Offline via FTP
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "App is being updated, please wait..." > /tmp/app_offline.htm
        curl -s -T /tmp/app_offline.htm --user "site84943:${{ secrets.MONSTERASP_FTP_PASSWORD }}" "ftp://hr-system-api.runasp.net/wwwroot/app_offline.htm"
        echo "Uploaded app_offline.htm - waiting for IIS to release file locks..."
        sleep 10

    - name: Deploy via FTP
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: hr-system-api.runasp.net
        username: site84943
        password: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        local-dir: ./publish_out/
        server-dir: /wwwroot/
        dangerous-clean-slate: false

    - name: Bring Site Back Online
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        curl -s --user "site84943:${{ secrets.MONSTERASP_FTP_PASSWORD }}" "ftp://hr-system-api.runasp.net" -Q "DELE /wwwroot/app_offline.htm" || true
        echo "Deleted app_offline.htm - site is back online!"

  build-angular:
    name: Verify Angular Frontend Scaffold
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Check Frontend Workspace
      run: |
        cd src/Buy2.Frontend
        ls -la
